/* Layout: the 360 photo fills the whole screen; buttons and the hotspot panel float on top of it. */
:root{--danger:#c0392b;--danger-fg:#ffffff;--bg:#ffffff;--surface:#ffffff;--soft-bg:#eef3f2;--fg:#1f3433;--muted:#5a706e;--line:#cfdcda;--btn:#2f7d74;--btn-fg:#ffffff;--marker:#ffffff;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;--body:"Lexend","Segoe UI",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d2e2d;--surface:#1d2e2d;--soft-bg:#142120;--fg:#e3eeec;--muted:#9db3b0;--line:#2f4644;--btn:#5fb3a8;--btn-fg:#0e1c1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d2e2d;--surface:#1d2e2d;--soft-bg:#142120;--fg:#e3eeec;--muted:#9db3b0;--line:#2f4644;--btn:#5fb3a8;--btn-fg:#0e1c1b;color-scheme:dark}
html,body{height:100%;overflow:hidden}
:root{padding:0!important}
body{background:#000;color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.5}
#pano{position:fixed;inset:0}
.top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top>*{pointer-events:auto}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top .note{color:#fff;font-size:1rem;margin-top:8px;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
.top button{background:var(--surface);color:var(--fg);border-color:var(--line)}
.top button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
button,.filebtn{font-family:var(--display);font-weight:600;font-size:1.05rem;cursor:pointer;border-radius:14px;padding:12px 18px;border:2px solid var(--line);background:transparent;color:var(--fg);min-height:52px;box-sizing:border-box;display:inline-flex;align-items:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.filebtn:focus-within{outline:3px solid #e9a23b;outline-offset:2px}
button.primary{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e9a23b;outline-offset:2px}
.hs{width:44px;height:44px;border-radius:50%;background:transparent;border:4px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.6),inset 0 0 4px rgba(0,0,0,.6);cursor:pointer;box-sizing:border-box}
.panel{position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto;max-height:70%;overflow:auto;
  background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.panel h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.5rem}
.panel p{margin:0;font-size:1.2rem;line-height:1.6;max-width:60ch}
label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
label.filebtn{display:inline-flex;flex-direction:row;color:var(--fg);font-size:1.05rem;position:relative}
input[type=text],textarea{font:inherit;color:var(--fg);background:var(--soft-bg);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
.state{font-size:.85rem;color:var(--muted)}
.panel.list{max-height:85%}
.home{position:fixed;inset:0;z-index:20;background:var(--soft-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px))}
.home h1{margin:0;font-family:var(--display);font-weight:600;font-size:2.2rem;line-height:1.2;text-wrap:balance}
.home p{margin:0;font-size:1.25rem;line-height:1.6;max-width:30ch}
.home button{font-size:1.3rem;padding:16px 48px;min-height:60px}
button.danger{background:var(--danger);color:var(--danger-fg);border-color:var(--danger)}
.advs{display:flex;flex-direction:column;gap:16px;width:min(100%,420px)}
.home .advs button{justify-content:center;text-align:center;width:100%;padding:18px 24px;min-height:72px;font-size:1.3rem}
button.back{width:52px;padding:0;justify-content:center;background:var(--surface);color:var(--fg);border-color:var(--line)}
button.back svg{width:26px;height:26px}
.home .back{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(16px + env(safe-area-inset-top,0px));min-height:52px;padding:0}
.line{border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.line h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.2rem}
.line p{font-size:1.05rem}
.tag{font-family:var(--display);font-weight:600;background:#e9a23b;color:#3a2604;border-radius:10px;padding:6px 12px}
</style>
</head>
<body>

<!-- Adventures page: the first thing everyone sees -->
<div class="home" id="menu">
  <p>Max wants you to join him in his adventures. Tap on the adventures below to join him and experience the world with him.</p>
  <div class="advs" id="advs"></div>
</div>

<!-- Entry page for the chosen adventure -->
<div class="home" id="entry" hidden>
  <button type="button" class="back" id="entryBack" aria-label="Back to adventures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7M8 12h13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <h1 id="entryTitle"></h1>
  <p id="entryText"></p>
  <button type="button" class="primary" id="enterBtn">Enter</button>
</div>

<div id="pano"></div>
<div class="top" id="top" hidden>
  <div class="bar">
    <button type="button" class="back" id="sceneBack" aria-label="Back to adventures"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7M8 12h13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="tag" id="adminTag" hidden>Admin</span>
    <button type="button" id="muteBtn" aria-pressed="false">Mute</button>
    <button type="button" id="grownBtn">Grown-ups</button>
    <button type="button" id="shareBtn" hidden>Share hotspots with Claude</button>
  </div>
  <div class="note" id="note">Tap a white ring to find out about it.</div>
</div>
<div class="panel" id="panel" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- Adventures (in the order shown on the adventures page) ----
// builtIn = hotspots made by the admin and published with the site; sounds = built-in sound files per hotspot id.
const ADVENTURES=[
 {id:'costco',label:'Max goes to Costco',image:'costco.jpg',store:'costcoHotspots.v1',
  title:'Come to Costco with Max',
  text:'Max is visiting Costco today and would like you to come with him. Click the button below to join him and explore Costco.',
  builtIn:[
   {"id":"example","title":"The tills","text":"These are the tills. They go beep when the food is scanned. There are queues of people here waiting to order their food.","yaw":-22,"pitch":-2},
   {"id":"smw3m9joi","title":"Menu Board","text":"This is the menu Board. It has images of the food being sold and the prices so that people can decide what to eat. Max likes looking at menu boards and memorizing prices","yaw":8,"pitch":9.4},
   {"id":"smw3madit","title":"Crowds","text":"There is a crowd of people eating their meal at the food court. Sometimes the crowds make Max anxious because of all the multiple conversations he can hear. He likes to wear his headphones when this happens. But he also enjoys observing people.","yaw":49.4,"pitch":-5}
  ],
  sounds:{"example":"sounds/tills.mp3","smw3madit":"sounds/crowds.mp3","smw3m9joi":"sounds/menu.mp3"}},
 {id:'tube',label:'Max takes the underground train',image:'tube.jpg',store:'tubeHotspots.v1',
  title:'',
  text:'Max is going to central London today and is going to take the tube. Tap through to explore what the inside of a London underground train looks like.',
  builtIn:[],
  sounds:{}}
];

let cur=null,spots=[],BUILT_SOUNDS={};
// Hotspots edited in admin mode are saved on this device; otherwise the built-in ones are used.
function loadSpots(a){let s=null;try{s=JSON.parse(localStorage.getItem(a.store))}catch(e){}
  return (Array.isArray(s)&&s.length)?s:JSON.parse(JSON.stringify(a.builtIn))}
const save=()=>{try{localStorage.setItem(cur.store,JSON.stringify(spots))}catch(e){}};

// audio files live in this browser (IndexedDB)
let db=null;
const openDb=()=>new Promise(r=>{try{const q=indexedDB.open('costcoAudio',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>r()}catch(e){r()}});
const get=k=>new Promise(r=>{if(!db)return r(null);try{const q=db.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)}catch(e){r(null)}});
const put=(k,v)=>new Promise(r=>{if(!db)return r(false);try{const t=db.transaction('a','readwrite');t.objectStore('a').put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false)}catch(e){r(false)}});
const del=k=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('a','readwrite');t.objectStore('a').delete(k);t.oncomplete=()=>r();t.onerror=()=>r()}catch(e){r()}});

let muted=false,player=null,limit=0;
const SOUND_LIMIT=10; // seconds: sounds stop after this; the parent's voice plays in full
const FADE=2; // seconds of fade-out before the limit
const toUrl=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=()=>r(null);fr.readAsDataURL(b)});
function stop(){if(player){player.pause();player=null}syncCtl()}
function syncCtl(){const c=$('ctl');if(!c)return;c.hidden=!player;const pp=$('cPlay');if(pp&&player)pp.textContent=player.paused?'Play':'Pause'}
async function play(key){stop();const b=await get(key);let url=null;
  if(b)url=await toUrl(b);else if(key.startsWith('sound:'))url=BUILT_SOUNDS[key.slice(6)]||null;
  if(!url)return;
  const a=new Audio(url);player=a;a.muted=muted;limit=key.startsWith('sound:')?SOUND_LIMIT:0;
  a.addEventListener('timeupdate',()=>{if(limit&&a.currentTime>=limit){a.pause();syncCtl()}});
  const fade=()=>{if(player!==a)return;if(limit){const left=limit-a.currentTime;a.volume=Math.max(0,Math.min(1,left/FADE));if(left<=0&&!a.paused){a.pause()}}if(!a.paused)requestAnimationFrame(fade)};
  a.addEventListener('play',()=>requestAnimationFrame(fade));
  a.addEventListener('ended',syncCtl);a.addEventListener('pause',syncCtl);a.addEventListener('play',syncCtl);
  a.play().catch(()=>{});syncCtl()}
function togglePlay(){if(!player)return;if(player.paused){if(limit&&player.currentTime>=limit)player.currentTime=0;if(player.ended)player.currentTime=0;player.play().catch(()=>{})}else player.pause()}
function replay(){if(!player)return;player.currentTime=0;player.play().catch(()=>{})}
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').setAttribute('aria-pressed',muted);$('muteBtn').textContent=muted?'Unmute':'Mute';if(player)player.muted=muted};

// Modes: child (default), parent (via Grown-ups button), admin (separate link ending #admin)
const editing=location.hash==='#admin';
window.addEventListener('hashchange',()=>location.reload());
if(editing){$('adminTag').hidden=false;$('shareBtn').hidden=false;$('grownBtn').hidden=true;
  $('note').textContent='Tap anywhere on the photo to add a hotspot. Tap a ring to change it.'}

// ---- Navigation: adventures page -> entry page -> 360 scene ----
let viewer=null;
function cfg(s){return{id:s.id,yaw:s.yaw,pitch:s.pitch,cssClass:'hs',createTooltipFunc:d=>{d.dataset.spot=s.id;d.setAttribute('aria-label',s.title)}}}
function redraw(){if(!viewer)return;(viewer.getConfig().hotSpots||[]).map(h=>h.id).forEach(id=>viewer.removeHotSpot(id));spots.forEach(s=>viewer.addHotSpot(cfg(s)))}
function loadScene(a){
  if(viewer){try{viewer.destroy()}catch(e){}viewer=null}
  viewer=pannellum.viewer('pano',{type:'equirectangular',panorama:a.image,autoLoad:true,showControls:false,hfov:50,minHfov:50,maxHfov:100,hotSpots:spots.map(cfg)});
}
function pick(a){
  cur=a;spots=loadSpots(a);BUILT_SOUNDS=a.sounds||{};
  loadScene(a); // starts loading the photo while the entry page is read
  $('menu').hidden=true;
  if(editing){$('top').hidden=false;return}
  $('entryTitle').textContent=a.title;$('entryTitle').hidden=!a.title;
  $('entryText').textContent=a.text;$('entry').hidden=false;
}
function showMenu(){
  closePanel();$('top').hidden=true;$('entry').hidden=true;$('menu').hidden=false;
  if(viewer){try{viewer.destroy()}catch(e){}viewer=null}
  cur=null;
}
$('advs').innerHTML=ADVENTURES.map((a,i)=>'<button type="button" class="primary" id="adv'+i+'">'+esc(a.label)+'</button>').join('');
ADVENTURES.forEach((a,i)=>{$('adv'+i).onclick=()=>pick(a)});
$('enterBtn').onclick=()=>{$('entry').hidden=true;$('top').hidden=false};
$('entryBack').onclick=showMenu;$('sceneBack').onclick=showMenu;

$('shareBtn').onclick=()=>{
  const txt=JSON.stringify({adventure:cur.id,hotspots:spots.map(({id,title,text,yaw,pitch})=>({id,title,text,yaw,pitch}))},null,1);
  const show=msg=>{$('panel').innerHTML='<h2>Share hotspots with Claude</h2><p>'+msg+'</p><textarea id="shareBox" readonly style="min-height:160px"></textarea><div class="bar"><button type="button" id="shareClose">Close</button></div>';
    $('panel').hidden=false;$('shareBox').value=txt;$('shareClose').onclick=closePanel;return $('shareBox')};
  const fallback=()=>{const b=show('Press and hold the text below, choose Select all, then Copy, and paste it into the chat with Claude.');b.focus();b.select()};
  try{navigator.clipboard.writeText(txt).then(()=>show('Copied. Paste it into the chat with Claude.'),fallback)}catch(e){fallback()}};
$('grownBtn').onclick=()=>openParent();

// tap detection (works for touch and mouse; ignores drags)
let down=null;const el=$('pano');
el.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY}},true);
el.addEventListener('pointerup',e=>{if(!down||!viewer)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(m>10)return;
  const hit=e.target.closest&&e.target.closest('[data-spot]');
  if(hit){const s=spots.find(x=>x.id===hit.dataset.spot);if(s)(editing?editSpot(s):showSpot(s));return}
  if(editing){const [p,y]=viewer.mouseEventToCoords({clientX:e.clientX,clientY:e.clientY});editSpot(null,{pitch:+p.toFixed(1),yaw:+y.toFixed(1)})}},true);

function closePanel(){if(rec){try{rec.r.stop()}catch(e){}}stop();$('panel').hidden=true;$('panel').classList.remove('list');$('panel').innerHTML='';if(cur&&$('entry').hidden)$('top').hidden=false}

// In-app recording (needs microphone access; the Claude app blocks it, a normal website allows it)
let rec=null;
async function toggleRec(i,k,refresh){
  const btn=$('pr'+i),st=$('ps'+i);
  if(rec&&rec.i===i){rec.r.stop();return}
  if(rec){st.textContent='Finish the other recording first';return}
  stop();
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){st.textContent='Recording isn’t available here. It will work once the app is on its own website.';return}
  const chunks=[];let r;
  try{r=new MediaRecorder(stream)}catch(e){stream.getTracks().forEach(t=>t.stop());st.textContent='This phone can’t record here.';return}
  const t0=Date.now();const tick=setInterval(()=>{st.textContent='Recording… '+Math.floor((Date.now()-t0)/1000)+'s'},250);
  r.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.onstop=async()=>{clearInterval(tick);stream.getTracks().forEach(t=>t.stop());rec=null;btn.textContent='Record again';
    const blob=new Blob(chunks,{type:r.mimeType||'audio/webm'});
    const ok=blob.size&&await put(k,blob);if(!ok)st.textContent='Could not save on this phone';else refresh()};
  rec={i,r};r.start();btn.textContent='Stop';st.textContent='Recording… 0s';
}
// Parent mode: a list of every hotspot's words in this adventure, with the parent's recording for each
async function openParent(){
  stop();const p=$('panel');p.classList.add('list');$('top').hidden=true;
  p.innerHTML='<div class="bar"><h2 style="flex:1">Record your voice</h2><button type="button" id="parentDone">Back to child view</button></div>'+
    '<p style="font-size:1rem">Tap Record, read the words out loud, then tap Stop. You can play it back and record again.</p>'+
    (spots.length?'':'<p style="font-size:1rem">There are no hotspots in this adventure yet.</p>')+
    spots.map((s,i)=>'<div class="line"><h3>'+esc(s.title)+'</h3><p>'+esc(s.text)+'</p><div class="bar">'+
      '<button type="button" class="primary" id="pr'+i+'">Record</button>'+
      '<label class="filebtn" for="pv'+i+'">Add a file<input class="vh" type="file" id="pv'+i+'" accept="audio/*"></label>'+
      '<button type="button" id="pp'+i+'">Play</button><button type="button" id="px'+i+'">Remove</button><span class="state" id="ps'+i+'"></span></div></div>').join('')+
    '<div class="bar" id="ctl" hidden><button type="button" id="cPlay">Pause</button><button type="button" id="cReplay">Replay</button></div>';
  p.hidden=false;$('parentDone').onclick=closePanel;$('cPlay').onclick=togglePlay;$('cReplay').onclick=replay;
  spots.forEach((s,i)=>{const k='voice:'+s.id;
    const refresh=async()=>{const has=!!(await get(k));$('ps'+i).textContent=has?'Added':'Not recorded yet';$('pp'+i).disabled=!has;$('px'+i).disabled=!has};refresh();
    $('pv'+i).addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const ok=await put(k,f);if(!ok)$('ps'+i).textContent='Could not save on this phone';else refresh()});
    $('pr'+i).onclick=()=>toggleRec(i,k,refresh);
    $('pp'+i).onclick=()=>play(k);$('px'+i).onclick=async()=>{stop();await del(k);refresh()}});
}

async function showSpot(s){
  const hasVoice=!!(await get('voice:'+s.id)),hasSound=!!(await get('sound:'+s.id))||!!BUILT_SOUNDS[s.id];
  $('panel').innerHTML='<h2>'+esc(s.title)+'</h2><p>'+esc(s.text)+'</p><div class="bar">'+
    '<button type="button" class="primary" id="pVoice"'+(hasVoice?'':' disabled')+'>Parent reads it</button>'+
    '<button type="button" id="pSound"'+(hasSound?'':' disabled')+'>Hear the sound</button>'+
    '<button type="button" class="danger" id="pClose">Close</button></div>'+
    '<div class="bar" id="ctl" hidden><button type="button" id="cPlay">Pause</button><button type="button" id="cReplay">Replay</button></div>'+
    ((hasVoice&&hasSound)?'':'<span class="state">'+(!hasVoice?'No parent recording yet. ':'')+(!hasSound?'No sound added yet.':'')+'</span>');
  $('panel').hidden=false;
  $('pVoice').onclick=()=>play('voice:'+s.id);$('pSound').onclick=()=>play('sound:'+s.id);$('pClose').onclick=closePanel;$('cPlay').onclick=togglePlay;$('cReplay').onclick=replay;
}

function editSpot(s,pos){
  const isNew=!s;s=s||{id:'s'+Date.now().toString(36),title:'',text:'',yaw:pos.yaw,pitch:pos.pitch};
  $('panel').innerHTML='<h2>'+(isNew?'New hotspot':'Change hotspot')+'</h2>'+
    '<label for="fTitle">Name<input type="text" id="fTitle" value="'+esc(s.title)+'"></label>'+
    '<label for="fText">What it says<textarea id="fText">'+esc(s.text)+'</textarea></label>'+
    '<div class="bar"><label class="filebtn" for="fSoundIn">Add a sound<input class="vh" type="file" id="fSoundIn" accept="audio/*"></label><button type="button" id="fSoundX">Remove</button><span class="state" id="sSound"></span></div>'+
    '<div class="bar"><button type="button" class="primary" id="fSave">Save</button>'+(isNew?'':'<button type="button" id="fDel">Delete</button>')+'<button type="button" class="danger" id="fCancel">Cancel</button></div>';
  $('panel').hidden=false;
  const vk='voice:'+s.id,sk='sound:'+s.id;
  const refresh=async()=>{$('sSound').textContent=(await get(sk))?'Added on this phone':(BUILT_SOUNDS[s.id]?'Built-in sound':'None yet')};refresh();
  const bind=(id,k)=>$(id).addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const ok=await put(k,f);if(!ok)$('sSound').textContent='Could not save on this phone';else refresh()});bind('fSoundIn',sk);
  $('fSoundX').onclick=async()=>{await del(sk);refresh()};
  $('fCancel').onclick=()=>{if(isNew)del(sk);closePanel()};
  $('fSave').onclick=()=>{const t=$('fTitle').value.trim();if(!t){$('fTitle').focus();return}
    s.title=t;s.text=$('fText').value.trim();if(isNew)spots.push(s);save();redraw();closePanel()};
  if(!isNew)$('fDel').onclick=()=>{spots=spots.filter(x=>x.id!==s.id);save();del(vk);del(sk);redraw();closePanel()};
  $('fTitle').focus({preventScroll:true});
}
openDb();
})();
</script>
